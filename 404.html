<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Switchboard</title>
<style>
  body { margin: 0; padding: 28px 16px; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #F1EFE8; color: #1D1E1B; }
  @media (prefers-color-scheme: dark) { body { background: #161714; color: #ECEAE2; } a { color: #F3C22F; } }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font: 700 30px/1.1 "Arial Narrow", system-ui, sans-serif; text-transform: uppercase; margin: 0 0 10px; }
  code { font-size: 15px; overflow-wrap: anywhere; }
</style>
<script>
// The resolver. A sticker holds https://tag.junkdrawer.works/<letter>/<id>; GitHub Pages answers every such address
// with this page, which sends the phone on to the app that owns the letter. Keep ROUTES and NAMES in step with
// js/kit/tags.js (test/tags.test.mjs checks). To send one sticker somewhere else, add it to OVERRIDES as
// 'letter/id': 'https://…', for example 'h/water-heater': 'https://example.com/manual'. Keys are lowercased as the page
// loads, like the address tapped, so 'H/Boiler' and 'h/boiler' are the same sticker.
var ROUTES = {
  h: 'https://placard.junkdrawer.works/',
  t: 'https://mothball.junkdrawer.works/',
  p: 'https://larder.junkdrawer.works/',
  f: 'https://frostbite.junkdrawer.works/',
  m: 'https://packrat.junkdrawer.works/',
  s: 'https://tag.junkdrawer.works/'
};
var NAMES = { h: 'Placard', t: 'Mothball', p: 'Larder', f: 'Frostbite', m: 'Packrat', s: 'Switchboard' };
var OVERRIDES = {
};
(function () {
  var lower = {};
  for (var k in OVERRIDES) lower[k.toLowerCase()] = OVERRIDES[k];
  OVERRIDES = lower;
  var m = /^\/([a-z])\/([a-z0-9][a-z0-9-]{0,39})\/?$/i.exec(location.pathname);
  if (!m) return;
  var key = m[1].toLowerCase() + '/' + m[2].toLowerCase();
  var to = OVERRIDES[key] || (ROUTES[m[1].toLowerCase()] ? ROUTES[m[1].toLowerCase()] + '#' + m[2].toLowerCase() : null);
  if (to) {
    window.__to = to;
    // Switchboard's offline copy, for a phone that only ever taps stickers (a tenant's): the next tap with no signal
    // or one bar still gets here. Not waited on: the worker installs in the background and the tap goes on at once.
    if (navigator.serviceWorker) navigator.serviceWorker.register(location.origin + '/sw.js').catch(function () {});
    location.replace(to);
  }
})();
</script>
</head>
<body>
<main>
  <h1 id="title">This tag isn't set up</h1>
  <p id="points">The sticker you tapped points at <code id="here"></code>, <span id="why">which doesn't belong to any app yet.</span></p>
  <p id="app" hidden>It's one of <span id="name"></span>'s stickers. <a id="open" href="">Open <span id="name2"></span></a> to find its page.</p>
  <p><a href="https://tag.junkdrawer.works/">Switchboard</a> explains what these tags are.</p>
</main>
<script>
// A letter an app owns, with an id that isn't a whole one (/h/, /h/-bad, /h/water-heater/more): the link was cut short
// when the sticker was written, or typed wrong. Say so, and open that app. The address is shown as typed (%C3%A4 as ä,
// %20 as a space), or as it came if it doesn't decode; this page opened by its own name says only what it is.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if (location.pathname === '/404.html') { $('title').textContent = 'Switchboard\'s page for tags'; $('points').hidden = true; return; }
  var path = location.pathname;
  try { path = decodeURIComponent(path); } catch (e) { /* cut short mid-character: as it came */ }
  $('here').textContent = location.host + path;
  var l = (/^\/([a-z])(\/|$)/i.exec(location.pathname) || [])[1];
  l = l && l.toLowerCase();
  if (!l || !ROUTES[l] || window.__to) return; // __to: on its way to the app
  $('title').textContent = 'This link is cut short or mistyped';
  $('why').textContent = 'which isn\'t a whole tag address.';
  $('name').textContent = $('name2').textContent = NAMES[l];
  $('open').href = ROUTES[l];
  $('app').hidden = false;
})();
</script>
</body>
</html>
